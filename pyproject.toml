[project]
name = "gigbid"
version = "1.0.0"
description = "GigBid: Multi-Agent Freelancer Copilot (AI-4016 Assignment 2)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.31.0",
  "pydantic>=2.9.0",
  "pyyaml>=6.0.2",
  "langgraph>=1.0.0",
  "langchain-core>=1.0.0",
  "langchain-mcp-adapters>=0.2.0",
  "mcp>=1.2.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "rank-bm25>=0.2.2",
  "numpy>=2.0.0",
  "scikit-learn>=1.5.0",
  "cryptography>=43.0.0",
  "aiosqlite>=0.20.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.7.0", "reportlab>=4.2.0"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
